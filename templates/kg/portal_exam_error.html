{% extends "base.html" %}
{% block title %}Exam · Kingdom Gateway{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-5" style="background-color: var(--color-paper);">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm p-7 text-center"
       style="border: 1px solid var(--color-border);">
    <div class="text-5xl">⚠️</div>
    <h1 class="mt-3 font-display text-xl text-gray-900">We couldn't process that</h1>
    <p class="mt-2 text-sm text-gray-600">{{ error or "An unexpected error occurred." }}</p>
    <a href="/portal/kg" class="mt-6 inline-block px-5 py-2 rounded-lg bg-ink text-white text-sm font-medium">
      Back to my cohort
    </a>
  </div>
</div>
{% endblock %}
