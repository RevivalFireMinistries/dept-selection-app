{% extends "base.html" %}
{% block title %}Attendance Report — Elder{% endblock %}
{% block content %}
<div class="min-h-screen pb-32" style="background-color: var(--color-paper);">

  <!-- Header -->
  <header class="sticky top-0 z-30 shadow-sm text-white px-5 py-4" style="background-color: var(--color-ink);">
    <div class="max-w-2xl mx-auto flex items-center gap-3">
      <a href="/portal" class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
         style="background-color: rgba(255,255,255,0.15);">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <div>
        <div class="text-[10px] uppercase tracking-[0.2em] text-white/60">Elder Tools</div>
        <div class="text-base font-semibold">Attendance Report</div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-5 space-y-4" id="app">

    <!-- ── Filter card ────────────────────────────────────────────────── -->
    <div class="bg-white rounded-2xl shadow-sm p-5 space-y-4" style="border:1px solid var(--color-border);">

      <!-- Month -->
      <div>
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1.5" style="color:var(--color-mute);">Month</label>
        <input type="month" id="monthPicker"
               class="w-full px-4 py-3 rounded-xl text-base focus:ring-2 focus:outline-none"
               style="background-color:var(--color-paper);border:1px solid var(--color-border);color:var(--color-ink);"
               onchange="onMonthChange()">
      </div>

      <!-- Service type dropdown -->
      <div>
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1.5" style="color:var(--color-mute);">Service</label>
        <select id="serviceTypeSelect" onchange="onServiceTypeChange()" disabled
                class="w-full px-4 py-3 rounded-xl text-base appearance-none focus:ring-2 focus:outline-none"
                style="background-color:var(--color-paper);border:1px solid var(--color-border);color:var(--color-ink);background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 viewBox=%220 0 24 24%22 stroke=%22%236E6457%22><path stroke-linecap=%22round%22 stroke-linejoin=%22round%22 stroke-width=%222%22 d=%22M19 9l-7 7-7-7%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;background-size:18px;padding-right:44px;">
          <option value="">Loading…</option>
        </select>
        <p id="serviceTypeError" class="hidden text-xs mt-1" style="color:#ef4444;"></p>
      </div>

      <!-- Max attendance dropdown -->
      <!-- Generate button -->
      <button id="generateBtn" onclick="generateReport()"
              class="w-full py-3.5 rounded-xl text-base font-semibold transition-all"
              style="background-color:var(--color-ink);color:white;">
        Generate Report
      </button>
    </div>

    <!-- ── Loading state ─────────────────────────────────────────────── -->
    <div id="loadingState" class="hidden text-center py-12">
      <div class="inline-block w-8 h-8 border-2 rounded-full animate-spin mb-3"
           style="border-color:var(--color-border);border-top-color:var(--color-ember);"></div>
      <p class="text-sm" style="color:var(--color-mute);">Fetching attendance data…</p>
      <p class="text-xs mt-1" style="color:var(--color-mute);">This may take a moment for large assemblies.</p>
    </div>

    <!-- ── Error state ───────────────────────────────────────────────── -->
    <div id="errorState" class="hidden rounded-2xl px-4 py-3 text-sm"
         style="background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;"></div>

    <!-- ── Results ───────────────────────────────────────────────────── -->
    <div id="results" class="hidden space-y-4">

      <!-- Summary banner -->
      <div id="summaryBanner" class="bg-white rounded-2xl shadow-sm p-5" style="border:1px solid var(--color-border);">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div>
            <h2 class="font-semibold text-base" style="color:var(--color-ink);" id="reportTitle"></h2>
            <p class="text-xs mt-0.5" style="color:var(--color-mute);" id="reportSubtitle"></p>
            <p class="text-[11px] mt-1 hidden" style="color:var(--color-mute);" id="serviceDates"></p>
          </div>
          <button onclick="exportPDF()" id="pdfBtn"
                  class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all"
                  style="background-color:var(--color-ember);color:white;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Export / Share
          </button>
        </div>
        <!-- At-a-glance breakdown chips (read-only) -->
        <div id="bucketRow" class="flex flex-wrap gap-2"></div>

        <!-- Exact attendance filter (options built from this month's services) -->
        <div class="mt-4 pt-4" style="border-top:1px solid var(--color-border);">
          <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1.5" style="color:var(--color-mute);">Show members who attended exactly</label>
          <select id="exactAttendanceSelect" onchange="onExactAttendanceChange()"
                  class="w-full px-4 py-3 rounded-xl text-base appearance-none focus:ring-2 focus:outline-none"
                  style="background-color:var(--color-paper);border:1px solid var(--color-border);color:var(--color-ink);background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 fill=%22none%22 viewBox=%220 0 24 24%22 stroke=%22%236E6457%22><path stroke-linecap=%22round%22 stroke-linejoin=%22round%22 stroke-width=%222%22 d=%22M19 9l-7 7-7-7%22/></svg>');background-repeat:no-repeat;background-position:right 14px center;background-size:18px;padding-right:44px;">
            <option value="">All members</option>
          </select>
        </div>
      </div>

      <!-- Member list (flat, paginated) -->
      <div id="memberList" class="bg-white rounded-2xl shadow-sm overflow-hidden" style="border:1px solid var(--color-border);"></div>

      <!-- Pagination -->
      <div id="pagination" class="hidden items-center justify-between gap-3 px-1">
        <button id="prevPage" onclick="changePage(-1)"
                class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all"
                style="background-color:white;border:1px solid var(--color-border);color:var(--color-ink);">
          ‹ Prev
        </button>
        <span id="pageInfo" class="text-xs text-center flex-1" style="color:var(--color-mute);"></span>
        <button id="nextPage" onclick="changePage(1)"
                class="px-4 py-2.5 rounded-xl text-sm font-semibold transition-all"
                style="background-color:white;border:1px solid var(--color-border);color:var(--color-ink);">
          Next ›
        </button>
      </div>

    </div>

  </main>
</div>

<!-- Hidden printable area for PDF -->
<div id="pdfContent" class="hidden" style="font-family:sans-serif;padding:24px;max-width:700px;margin:0 auto;">
  <h1 id="pdfTitle" style="font-size:18px;margin-bottom:4px;color:#1F1B16;"></h1>
  <p id="pdfSubtitle" style="font-size:12px;color:#6E6457;margin-bottom:16px;"></p>
  <table id="pdfTable" style="width:100%;border-collapse:collapse;font-size:13px;">
    <thead>
      <tr style="background:#F5F5F0;">
        <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #EEE9E0;">#</th>
        <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #EEE9E0;">Name</th>
        <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #EEE9E0;">Phone</th>
        <th style="text-align:center;padding:8px 10px;border-bottom:1px solid #EEE9E0;">Attended</th>
      </tr>
    </thead>
    <tbody id="pdfTableBody"></tbody>
  </table>
  <p id="pdfFooter" style="font-size:11px;color:#9CA3AF;margin-top:16px;text-align:right;"></p>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>
<script>
let selectedMonth = '';
let selectedServiceType = '';
let reportData = null;
// Exact-attendance filter: '' = everyone; otherwise a number string — show
// only members who attended EXACTLY that many services. Options are built
// from the actual number of services held that month (0..total_services).
let exactAttendance = '';

const $ = (id) => document.getElementById(id);

// Default to current month and load its service types
(function init() {
    const now = new Date();
    $('monthPicker').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    onMonthChange();
})();

async function onMonthChange() {
    selectedMonth = $('monthPicker').value;
    selectedServiceType = '';
    $('results').classList.add('hidden');
    $('errorState').classList.add('hidden');

    const sel = $('serviceTypeSelect');
    sel.disabled = true;
    sel.innerHTML = '<option value="">Loading…</option>';
    $('serviceTypeError').classList.add('hidden');

    if (!selectedMonth) return;

    try {
        const res = await fetch(`/api/portal/elder/attendance/service-types?month=${selectedMonth}`);
        if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            throw new Error(d.detail || `HTTP ${res.status}`);
        }
        const types = await res.json();
        populateServiceTypes(types);
    } catch (e) {
        sel.innerHTML = '<option value="">—</option>';
        const err = $('serviceTypeError');
        err.textContent = 'Could not load services: ' + e.message;
        err.classList.remove('hidden');
    }
}

function populateServiceTypes(types) {
    const sel = $('serviceTypeSelect');
    if (!types.length) {
        sel.innerHTML = '<option value="">No services found this month</option>';
        sel.disabled = true;
        selectedServiceType = '';
        return;
    }
    sel.innerHTML = types.map(t => `<option value="${escAttr(t)}">${escHtml(t)}</option>`).join('');
    sel.disabled = false;
    // Default to Sunday (API returns it first when present)
    selectedServiceType = types.includes('Sunday') ? 'Sunday' : types[0];
    sel.value = selectedServiceType;
}

function onServiceTypeChange() {
    selectedServiceType = $('serviceTypeSelect').value;
}

function onExactAttendanceChange() {
    exactAttendance = $('exactAttendanceSelect').value;
    // Re-filter instantly — we already have all the data
    updateSubtitle();
    renderMemberList();
}

// Build the exact-attendance options from the number of services held this
// month: "All members", then "0", "1", … up to total_services. Resets to All.
function populateExactFilter(total) {
    exactAttendance = '';
    const sel = $('exactAttendanceSelect');
    let html = '<option value="">All members</option>';
    for (let n = 0; n <= total; n++) {
        const label = n === 0
            ? `0 — missed every service`
            : `${n} of ${total} service${total !== 1 ? 's' : ''}`;
        html += `<option value="${n}">${label}</option>`;
    }
    sel.innerHTML = html;
    sel.value = '';
}

async function generateReport() {
    if (!selectedMonth) { return; }
    if (!selectedServiceType) {
        const err = $('serviceTypeError');
        err.textContent = 'Please choose a service.';
        err.classList.remove('hidden');
        return;
    }
    $('results').classList.add('hidden');
    $('errorState').classList.add('hidden');
    $('loadingState').classList.remove('hidden');
    $('generateBtn').disabled = true;

    try {
        const url = `/api/portal/elder/attendance/report?month=${encodeURIComponent(selectedMonth)}&service_type=${encodeURIComponent(selectedServiceType)}`;
        const res = await fetch(url);
        if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            throw new Error(d.detail || `HTTP ${res.status}`);
        }
        reportData = await res.json();
        renderReport(reportData);
    } catch (e) {
        $('errorState').textContent = 'Could not load report: ' + e.message;
        $('errorState').classList.remove('hidden');
    } finally {
        $('loadingState').classList.add('hidden');
        $('generateBtn').disabled = false;
    }
}

function renderReport(data) {
    const [year, mo] = data.month.split('-');
    const monthName = new Date(year, mo - 1, 1).toLocaleString('default', { month: 'long' });
    document.getElementById('reportTitle').textContent = `${data.service_type} — ${monthName} ${year}`;

    populateExactFilter(data.total_services);
    updateSubtitle();
    renderBuckets(data);
    renderMemberList();

    document.getElementById('results').classList.remove('hidden');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateSubtitle() {
    if (!reportData) return;
    const shown = filteredMembers().length;
    const tot = reportData.total_services;
    let txt = `${shown} of ${reportData.total_members} members · ${tot} service${tot !== 1 ? 's' : ''} this month`;
    if (exactAttendance !== '') {
        txt += ` · attended exactly ${exactAttendance}`;
    }
    document.getElementById('reportSubtitle').textContent = txt;

    // Show the actual service dates so Elders can verify the count is right.
    const datesEl = document.getElementById('serviceDates');
    if (datesEl) {
        const dates = reportData.service_dates || [];
        if (dates.length) {
            const fmt = dates.map(d => {
                const dt = new Date(d + 'T00:00:00');
                return dt.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
            }).join(' · ');
            datesEl.textContent = 'Services counted: ' + fmt;
            datesEl.classList.remove('hidden');
        } else {
            datesEl.classList.add('hidden');
        }
    }
}

// Read-only at-a-glance breakdown chips (the dropdown does the filtering).
function renderBuckets(data) {
    const bucketRow = document.getElementById('bucketRow');
    const entries = Object.entries(data.buckets).sort(([a], [b]) => parseInt(a) - parseInt(b));
    bucketRow.innerHTML = entries.map(([k, count]) => {
        const [att, tot] = k.split('/').map(Number);
        const pct = tot > 0 ? Math.round((att / tot) * 100) : 0;
        const color = pct === 0 ? '#EF4444' : pct < 50 ? '#F59E0B' : '#10B981';
        return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold text-white" style="background:${color};">
            ${k} · ${count}
        </span>`;
    }).join('');
}

// Apply the exact-attendance filter: members who attended EXACTLY the
// selected number of services. '' = show everyone.
function filteredMembers() {
    if (!reportData) return [];
    if (exactAttendance === '') return reportData.members;
    const n = parseInt(exactAttendance, 10);
    return reportData.members.filter(m => m.attended === n);
}

const PAGE_SIZE = 25;
let currentPage = 1;

function changePage(delta) {
    currentPage += delta;
    renderMemberList(true);
    // Scroll the list back to the top on page change
    document.getElementById('memberList').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Colour for an attendance count badge: red (none), amber (<50%), green (>=50%)
function attBadgeColors(att, tot) {
    const pct = tot > 0 ? (att / tot) * 100 : 0;
    if (att === 0)   return { bg: '#FEE2E2', fg: '#B91C1C' };
    if (pct < 50)    return { bg: '#FEF3C7', fg: '#92400E' };
    return { bg: '#D1FAE5', fg: '#065F46' };
}

function renderMemberList(keepPage) {
    const members = filteredMembers();
    const list = document.getElementById('memberList');
    const pager = document.getElementById('pagination');

    if (!members.length) {
        const msg = exactAttendance !== ''
            ? `No members attended exactly ${exactAttendance} service${exactAttendance === '1' ? '' : 's'}.`
            : 'No members to show.';
        list.innerHTML = `<div class="text-center text-sm italic py-10" style="color:var(--color-mute);">${msg}</div>`;
        pager.classList.add('hidden');
        return;
    }

    const totalPages = Math.ceil(members.length / PAGE_SIZE);
    if (!keepPage) currentPage = 1;
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageMembers = members.slice(start, start + PAGE_SIZE);

    list.innerHTML = pageMembers.map(m => {
        const c = attBadgeColors(m.attended, m.total);
        return `
        <div class="flex items-center gap-3 px-4 py-3 border-b last:border-0" style="border-color:var(--color-border);">
            <div class="flex-shrink-0 w-11 h-11 rounded-xl flex flex-col items-center justify-center leading-none"
                 style="background:${c.bg};color:${c.fg};">
                <span class="text-base font-bold">${m.attended}</span>
                <span class="text-[9px] font-semibold opacity-70">of ${m.total}</span>
            </div>
            <div class="min-w-0 flex-1">
                <div class="text-sm font-semibold truncate" style="color:var(--color-ink);">${escHtml(m.name)}</div>
                <div class="text-xs truncate" style="color:var(--color-mute);">${escHtml(m.phone) || 'No phone on file'}</div>
            </div>
            ${m.phone ? `<a href="tel:${escAttr(m.phone)}"
               class="flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center"
               style="background:rgba(245,165,36,0.12);" aria-label="Call ${escAttr(m.name)}">
                <svg class="w-4 h-4" style="color:var(--color-ember);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
            </a>` : ''}
        </div>`;
    }).join('');

    // Pagination footer
    if (totalPages > 1) {
        pager.classList.remove('hidden');
        pager.classList.add('flex');
        const from = start + 1;
        const to = Math.min(start + PAGE_SIZE, members.length);
        document.getElementById('pageInfo').textContent =
            `${from}–${to} of ${members.length}  ·  page ${currentPage}/${totalPages}`;
        const prev = document.getElementById('prevPage');
        const next = document.getElementById('nextPage');
        prev.disabled = currentPage === 1;
        next.disabled = currentPage === totalPages;
        prev.style.opacity = prev.disabled ? '0.4' : '1';
        next.style.opacity = next.disabled ? '0.4' : '1';
    } else {
        pager.classList.add('hidden');
        pager.classList.remove('flex');
    }
}

async function exportPDF() {
    if (!reportData) return;
    const btn = document.getElementById('pdfBtn');
    btn.textContent = 'Generating…';
    btn.disabled = true;

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        const exportRows = filteredMembers();

        const [year, mo] = reportData.month.split('-');
        const monthName = new Date(year, mo - 1, 1).toLocaleString('default', { month: 'long' });
        const filterLabel = exactAttendance !== '' ? ` (attended exactly ${exactAttendance})` : '';
        const title = `${reportData.service_type} — ${monthName} ${year}${filterLabel}`;
        const subtitle = `Revival Fire Ministries · Attendance Report · ${new Date().toLocaleDateString('en-ZA')}`;

        // Header
        doc.setFontSize(16);
        doc.setFont('helvetica', 'bold');
        doc.text(title, 14, 18);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(110, 100, 87);
        doc.text(subtitle, 14, 25);
        doc.setTextColor(0, 0, 0);

        // Summary line
        const summaryParts = Object.entries(reportData.buckets)
            .sort(([a], [b]) => parseInt(a) - parseInt(b))
            .map(([k, c]) => `${k}: ${c}`).join('  ·  ');
        doc.setFontSize(9);
        doc.setTextColor(80, 80, 80);
        doc.text(`Showing: ${exportRows.length} of ${reportData.total_members} members    ${summaryParts}`, 14, 31);
        doc.setTextColor(0, 0, 0);

        // Table
        const rows = exportRows.map((m, i) => [
            String(i + 1),
            m.name,
            m.phone,
            `${m.attended}/${m.total}`,
        ]);

        doc.autoTable({
            startY: 36,
            head: [['#', 'Name', 'Phone', 'Attended']],
            body: rows,
            styles: { fontSize: 9, cellPadding: 3 },
            headStyles: { fillColor: [31, 27, 22], textColor: 255, fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [250, 247, 242] },
            columnStyles: { 0: { cellWidth: 10 }, 3: { cellWidth: 22, halign: 'center' } },
        });

        const filename = `attendance_${reportData.service_type.replace(/\s+/g, '_')}_${reportData.month}.pdf`;
        const blob = doc.output('blob');
        const file = new File([blob], filename, { type: 'application/pdf' });

        // Try Web Share API first (works on mobile → shares to WhatsApp etc.)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title,
                text: `${title}\n${subtitle}`,
                files: [file],
            });
        } else {
            // Fallback: download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
    } catch (e) {
        if (e.name !== 'AbortError') {
            alert('Could not export: ' + e.message);
        }
    } finally {
        btn.innerHTML = `<svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Export / Share`;
        btn.disabled = false;
    }
}

function escHtml(t) {
    const d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
}

// Escape a value for safe use inside a double-quoted HTML attribute.
function escAttr(t) {
    return String(t == null ? '' : t)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}
</script>
{% endblock %}
