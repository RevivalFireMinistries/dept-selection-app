{% extends "base.html" %}
{% block title %}My surveys · RFM Portal{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-6" x-data="mySurveys()" x-init="load()">
    <div class="flex items-center justify-between mb-4">
        <div>
            <a href="/portal" class="text-xs text-gray-400 hover:text-gray-600">← Back to portal</a>
            <h1 class="text-2xl font-bold text-gray-900">My surveys</h1>
            <p class="text-sm text-gray-500">Build and share surveys.</p>
        </div>
        <a href="/surveys/builder" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">+ New survey</a>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div x-show="loading" class="p-6 text-center text-sm text-gray-500">Loading…</div>
        <div x-show="!loading && !surveys.length" class="p-6 text-center text-sm text-gray-500">No surveys yet.</div>
        <div class="divide-y divide-gray-100">
            <template x-for="s in surveys" :key="s.id">
                <div class="p-4 flex items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <a :href="`/surveys/${s.id}/responses`" class="font-semibold text-gray-900 hover:text-indigo-600 truncate" x-text="s.title"></a>
                            <span x-show="s.is_anonymous" class="px-2 py-0.5 bg-amber-50 text-amber-700 text-[10px] font-medium rounded uppercase">Anonymous</span>
                            <span x-show="!s.is_active" class="px-2 py-0.5 bg-gray-100 text-gray-600 text-[10px] rounded">Closed</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
                            <span x-text="`${s.response_count || 0} responses`"></span>
                            <button @click="copyLink(s)" class="text-indigo-600 hover:text-indigo-800">Copy share link</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <a :href="`/surveys/${s.id}/responses`" class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded">Responses</a>
                        <a :href="`/surveys/builder?id=${s.id}`" class="px-3 py-1.5 text-xs border border-gray-300 text-gray-700 rounded">Edit</a>
                        <button @click="deleteSurvey(s)" class="px-2 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded">Delete</button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function mySurveys() {
    return {
        loading: true,
        surveys: [],
        async load() {
            try {
                const res = await fetch('/api/surveys');
                if (!res.ok) { this.surveys = []; this.loading = false; return; }
                const data = await res.json();
                this.surveys = data.surveys || [];
            } catch (e) { console.error(e); }
            this.loading = false;
        },
        copyLink(s) {
            const url = `${location.origin}/s/${s.slug}`;
            navigator.clipboard.writeText(url).then(() => alert('Link copied:\n' + url));
        },
        async deleteSurvey(s) {
            if (!confirm(`Delete "${s.title}" and all responses?`)) return;
            const res = await fetch(`/api/surveys/${s.id}`, {method: 'DELETE'});
            if (res.ok) this.surveys = this.surveys.filter(x => x.id !== s.id);
            else alert('Delete failed');
        },
    };
}
</script>
{% endblock %}
