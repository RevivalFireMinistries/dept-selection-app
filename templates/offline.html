{% extends "base.html" %}

{% block title %}Offline · RFM Portal{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6">
    <div class="max-w-md text-center">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl font-bold shadow-lg">RFM</div>
        <h1 class="mt-6 text-2xl font-bold text-gray-900">You're offline</h1>
        <p class="mt-2 text-gray-600">
            We couldn't reach the portal. Check your connection and try again.
            Pages you've already visited may still be available from cache.
        </p>
        <div class="mt-6 flex flex-col sm:flex-row gap-2 justify-center">
            <button onclick="location.reload()" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Retry</button>
            <a href="/" class="px-5 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">Go to home</a>
        </div>
    </div>
</div>
{% endblock %}
