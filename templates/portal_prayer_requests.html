{% extends "base.html" %}
{% block title %}Prayer Requests{% endblock %}
{% block content %}
<div class="min-h-screen pb-32" style="background-color: var(--color-paper);" x-data="prayerInbox()" x-init="load()">

  <header class="sticky top-0 z-30 shadow-sm text-white px-5 py-4" style="background-color: var(--color-ink);">
    <div class="max-w-2xl mx-auto flex items-center gap-3">
      <a href="/portal" class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: rgba(255,255,255,0.15);">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <div class="text-[10px] uppercase tracking-[0.2em] text-white/60">Prayer Ministry</div>
        <div class="text-base font-semibold">Prayer Requests</div>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-5 space-y-3">
    <div x-show="loading" class="text-center py-16 text-sm" style="color:var(--color-mute);">Loading…</div>

    <div x-show="!loading" x-cloak class="flex items-center gap-2 flex-wrap">
      <button @click="filter='all'" :class="filter==='all' ? 'text-white' : ''"
              :style="filter==='all' ? 'background-color:var(--color-ink);' : 'background-color:#fff;border:1px solid var(--color-border);color:var(--color-ink);'"
              class="px-3 py-1.5 text-xs font-semibold rounded-lg">All (<span x-text="requests.length"></span>)</button>
      <button @click="filter='new'" :class="filter==='new' ? 'text-white' : ''"
              :style="filter==='new' ? 'background-color:var(--color-ember);' : 'background-color:#fff;border:1px solid var(--color-border);color:var(--color-ink);'"
              class="px-3 py-1.5 text-xs font-semibold rounded-lg">New (<span x-text="newCount"></span>)</button>
      <button x-show="visible().length" @click="sharePdf()"
              class="ml-auto inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg text-white" style="background-color:#16a34a;">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607z"/></svg>
        Share PDF
      </button>
    </div>

    <div x-show="!loading && !visible().length" x-cloak class="bg-white rounded-2xl shadow-sm p-8 text-center" style="border:1px solid var(--color-border);">
      <div class="text-3xl mb-2">🙏</div>
      <p class="text-sm" style="color:var(--color-mute);">No prayer requests here yet.</p>
    </div>

    <template x-for="r in visible()" :key="r.id">
      <div class="bg-white rounded-2xl shadow-sm p-4" style="border:1px solid var(--color-border);"
           :style="r.status === 'new' ? 'border-left:3px solid var(--color-ember);' : ''">
        <div class="flex items-start justify-between gap-2 mb-1.5">
          <div class="text-[12px]" style="color:var(--color-mute);">
            <span class="font-semibold" style="color:var(--color-ink);" x-text="r.is_anonymous ? 'Anonymous' : (r.name || 'Member')"></span>
            <span x-show="!r.is_anonymous && r.phone" x-text="' · ' + r.phone"></span>
            <span x-text="' · ' + fmtDate(r.created_at)"></span>
          </div>
          <span class="text-[10px] uppercase tracking-wide font-bold px-2 py-0.5 rounded-full"
                :style="statusMeta(r.status).style" x-text="statusMeta(r.status).label"></span>
        </div>
        <p class="text-sm whitespace-pre-line" style="color:var(--color-ink);" x-text="r.request_text"></p>
        <div class="mt-3 flex items-center justify-between gap-2 flex-wrap">
          <div class="text-[11px]" style="color:var(--color-mute);">
            <span x-show="r.status !== 'new' && r.acknowledged_by" x-text="'Last handled by ' + r.acknowledged_by"></span>
          </div>
          <div class="flex items-center gap-2 ml-auto">
            <button x-show="r.status === 'new'" @click="setStatus(r, 'received')"
                    class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white" style="background-color:#7c3aed;">Mark received</button>
            <button x-show="r.status === 'received'" @click="setStatus(r, 'closed')"
                    class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white" style="background-color:#16a34a;">Close (prayed for)</button>
            <button x-show="r.status === 'closed'" @click="setStatus(r, 'received')"
                    class="px-3 py-1.5 text-xs font-semibold rounded-lg" style="border:1px solid var(--color-border);color:var(--color-mute);">Reopen</button>
          </div>
        </div>
      </div>
    </template>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
  const STATUS_META = {
    new:      { label: 'New',      style: 'background-color:#fef3c7;color:#b45309;' },
    received: { label: 'Received', style: 'background-color:#ede9fe;color:#6d28d9;' },
    closed:   { label: 'Closed',   style: 'background-color:#dcfce7;color:#15803d;' },
  };
  function prayerInbox() {
    return {
      loading: true, requests: [], newCount: 0, filter: 'all',
      STATUSES: ['new', 'received', 'closed'],
      statusMeta(s) { return STATUS_META[s] || STATUS_META.new; },
      async load() {
        try {
          const r = await fetch('/api/admin/prayer-requests');
          const d = await r.json();
          this.requests = d.requests || [];
          this.newCount = d.new_count || 0;
        } catch (e) { this.requests = []; }
        finally { this.loading = false; }
      },
      visible() {
        return this.filter === 'new' ? this.requests.filter(r => r.status === 'new') : this.requests;
      },
      async sharePdf() {
        const list = this.visible();
        if (!list.length) { alert('No requests to share.'); return; }
        if (!(window.jspdf && window.jspdf.jsPDF)) { alert('PDF is still loading — try again in a moment.'); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const when = new Date().toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' });
        const title = this.filter === 'new' ? 'New Prayer Requests' : 'Prayer Requests';
        doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.text(title, 14, 18);
        doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(110, 100, 87);
        doc.text(`Revival Fire Ministries · ${when} · ${list.length} request(s)`, 14, 25);
        doc.setTextColor(0, 0, 0);
        doc.autoTable({
          startY: 31,
          head: [['When', 'From', 'Prayer request', 'Status']],
          body: list.map(r => [
            this.fmtDate(r.created_at),
            r.is_anonymous ? 'Anonymous' : (r.name || 'Member'),
            r.request_text,
            this.statusMeta(r.status).label,
          ]),
          styles: { fontSize: 9, cellPadding: 2.5, valign: 'top' },
          headStyles: { fillColor: [31, 27, 22], textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [250, 247, 242] },
          columnStyles: { 0: { cellWidth: 26 }, 1: { cellWidth: 30 }, 3: { cellWidth: 22 } },
        });
        const filename = `prayer_requests_${new Date().toISOString().slice(0, 10)}.pdf`;
        const blob = doc.output('blob');
        const file = new File([blob], filename, { type: 'application/pdf' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title, text: `${title} — Revival Fire Ministries`, files: [file] });
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
          }
        } catch (e) {
          if (e.name !== 'AbortError') alert('Could not share: ' + e.message);
        }
      },
      async setStatus(r, status) {
        const was = r.status;
        try {
          const res = await fetch(`/api/admin/prayer-requests/${r.id}/status`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status }),
          });
          if (res.ok) {
            r.status = status;
            if (was === 'new' && status !== 'new') this.newCount = Math.max(0, this.newCount - 1);
            if (was !== 'new' && status === 'new') this.newCount += 1;
          }
        } catch (e) {}
      },
      fmtDate(iso) {
        if (!iso) return '';
        try { return new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
        catch (e) { return iso; }
      },
    };
  }
</script>
{% endblock %}
