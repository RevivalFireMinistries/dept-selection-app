{% extends "base.html" %}

{% block title %}Reset Password - RFM Stellenbosch Portal{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm space-y-5">

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                RFM Stellenbosch
            </h1>
            <p class="text-gray-500 text-sm mt-1">Portal</p>
        </div>

        <!-- Reset Password Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-1">Set New Password</h2>
            <p class="text-sm text-gray-500 mb-5">Choose a new password for your account</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="rpPassword" placeholder="At least 6 characters" autocomplete="new-password"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <p class="text-xs text-gray-400 mt-1">Minimum 6 characters</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" id="rpConfirm" placeholder="Re-enter password" autocomplete="new-password"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        onkeydown="if(event.key==='Enter') resetPassword();">
                </div>

                <button onclick="resetPassword()" id="rpBtn"
                    class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm hover:bg-indigo-700 transition-colors">
                    Reset Password
                </button>

                <div id="rpError" class="hidden text-sm text-red-600 text-center"></div>
                <div id="rpSuccess" class="hidden text-sm text-green-600 text-center"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    document.getElementById('rpError').textContent = 'Invalid reset link. Please request a new one.';
    document.getElementById('rpError').classList.remove('hidden');
    document.getElementById('rpBtn').disabled = true;
}

async function resetPassword() {
    const password = document.getElementById('rpPassword').value;
    const confirm = document.getElementById('rpConfirm').value;
    const errorDiv = document.getElementById('rpError');
    const successDiv = document.getElementById('rpSuccess');
    const btn = document.getElementById('rpBtn');

    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');

    if (password.length < 6) { errorDiv.textContent = 'Password must be at least 6 characters'; errorDiv.classList.remove('hidden'); return; }
    if (password !== confirm) { errorDiv.textContent = 'Passwords do not match'; errorDiv.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        });

        const data = await res.json();

        if (res.ok) {
            window.location.href = `/?message=${encodeURIComponent('Password reset successfully. You can now sign in.')}&type=success`;
        } else {
            errorDiv.textContent = data.detail || 'Reset failed';
            errorDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    } catch (e) {
        errorDiv.textContent = 'Something went wrong. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}
</script>
{% endblock %}
