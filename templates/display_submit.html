{% extends "base.html" %}
{% block title %}Submit for Display | RFM{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto p-4 pb-20">
  <div class="text-center mb-5">
    <h1 class="text-xl font-bold text-gray-900">Submit for Display</h1>
    <p class="text-gray-500 text-xs mt-1">Add items to be displayed on screen during services</p>
  </div>

  <!-- Success toast -->
  <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-green-600 text-white text-sm rounded-lg shadow-lg">
    Item submitted!
  </div>

  <!-- Your Info (collapsed by default, remembered) -->
  <details id="infoSection" class="mb-4 bg-white rounded-lg border">
    <summary class="px-4 py-3 text-sm font-medium text-gray-700 cursor-pointer">Your Info & Service Details</summary>
    <div class="px-4 pb-3 space-y-2">
      <input id="submitterName" class="w-full px-3 py-2 border rounded-md text-sm" placeholder="Your name *">
      <div class="flex gap-2">
        <input id="serviceDate" type="date" class="flex-1 px-3 py-2 border rounded-md text-sm">
        <select id="displaySlot" class="flex-1 px-3 py-2 border rounded-md text-sm">
          <option value="before_service">Before Service</option>
          <option value="during_worship">During Worship</option>
          <option value="announcements" selected>Announcements</option>
          <option value="during_sermon">During Sermon</option>
          <option value="after_service">After Service</option>
          <option value="any">Any Time</option>
        </select>
      </div>
    </div>
  </details>

  <!-- Submitted items list -->
  <div id="submittedList" class="hidden mb-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-medium text-gray-500 uppercase">Submitted Items</span>
      <span id="submittedCount" class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">0</span>
    </div>
    <div id="submittedItems" class="space-y-1"></div>
  </div>

  <!-- Add Item Buttons -->
  <div class="grid grid-cols-2 gap-2 mb-4">
    <button onclick="showForm('image')" class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-dashed rounded-lg text-sm font-medium text-gray-600 hover:border-orange-400 hover:text-orange-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Image / Poster
    </button>
    <button onclick="showForm('video')" class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-dashed rounded-lg text-sm font-medium text-gray-600 hover:border-orange-400 hover:text-orange-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      Video
    </button>
    <button onclick="showForm('scripture')" class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-dashed rounded-lg text-sm font-medium text-gray-600 hover:border-orange-400 hover:text-orange-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      Scripture
    </button>
    <button onclick="showForm('sermon_info')" class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-dashed rounded-lg text-sm font-medium text-gray-600 hover:border-orange-400 hover:text-orange-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      Sermon Title
    </button>
    <button onclick="showForm('nugget')" class="col-span-2 flex items-center justify-center gap-2 p-3 bg-white border-2 border-dashed rounded-lg text-sm font-medium text-gray-600 hover:border-orange-400 hover:text-orange-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      Sermon Point / Nugget
    </button>
  </div>

  <!-- Dynamic Form (shown when a type is selected) -->
  <div id="itemForm" class="hidden bg-white rounded-lg border p-4 mb-4">
    <div class="flex items-center justify-between mb-3">
      <h3 id="formTitle" class="text-sm font-semibold text-gray-800"></h3>
      <button onclick="hideForm()" class="text-gray-400 hover:text-gray-600 text-lg">&times;</button>
    </div>

    <input type="hidden" id="formType">

    <!-- Title (always shown) -->
    <div class="mb-3">
      <input id="itemTitle" class="w-full px-3 py-2 border rounded-md text-sm" placeholder="Title *">
    </div>

    <!-- File upload (image/video only) -->
    <div id="fileRow" class="hidden mb-3">
      <input id="itemFile" type="file" class="w-full px-3 py-2 border rounded-md text-sm bg-gray-50">
      <p id="fileSizeHint" class="text-xs text-gray-400 mt-1"></p>
    </div>

    <!-- Scripture picker (scripture type only) -->
    <div id="scriptureRow" class="hidden mb-3">
      <div class="mb-2">
        <select id="bibleVersion" class="w-full px-3 py-2 border rounded-md text-sm">
          <option value="KJV">KJV - King James Version</option>
          <option value="NIV">NIV - New International Version</option>
          <option value="NKJV">NKJV - New King James Version</option>
          <option value="ESV">ESV - English Standard Version</option>
          <option value="NLT">NLT - New Living Translation</option>
          <option value="AMP">AMP - Amplified Bible</option>
          <option value="MSG">MSG - The Message</option>
          <option value="ASV">ASV - American Standard Version</option>
        </select>
      </div>
      <div class="flex gap-2 mb-2">
        <div class="relative flex-1">
          <input id="bookInput" class="w-full px-3 py-2 border rounded-md text-sm" placeholder="Book (e.g., Romans)" autocomplete="off">
          <div id="bookSuggestions" class="hidden absolute top-full left-0 right-0 mt-1 bg-white border rounded-md shadow-lg max-h-40 overflow-y-auto z-10"></div>
        </div>
        <input id="chapterInput" type="number" min="1" class="w-20 px-3 py-2 border rounded-md text-sm" placeholder="Ch">
        <span class="self-center text-gray-400">:</span>
        <input id="verseStartInput" type="number" min="1" class="w-20 px-3 py-2 border rounded-md text-sm" placeholder="From">
        <span class="self-center text-gray-400">-</span>
        <input id="verseEndInput" type="number" min="1" class="w-20 px-3 py-2 border rounded-md text-sm" placeholder="To">
      </div>
      <button type="button" onclick="addVerse()" class="w-full py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-md text-xs font-medium hover:bg-blue-100">
        + Add Verse
      </button>
      <div id="verseList" class="mt-2 space-y-1"></div>
    </div>

    <!-- Text body (nugget/sermon/announcement) -->
    <div id="bodyRow" class="hidden mb-3">
      <textarea id="itemBody" rows="3" class="w-full px-3 py-2 border rounded-md text-sm" placeholder=""></textarea>
    </div>

    <!-- Subtitle (sermon/nugget) -->
    <div id="subtitleRow" class="hidden mb-3">
      <input id="itemSubtitle" class="w-full px-3 py-2 border rounded-md text-sm" placeholder="Subtitle / Speaker">
    </div>

    <!-- Comments -->
    <div class="mb-3">
      <input id="itemComments" class="w-full px-3 py-2 border rounded-md text-sm" placeholder="Notes for the operator (optional)">
    </div>

    <button onclick="submitItem()" id="submitBtn" class="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-lg text-sm transition-colors">
      Add Item
    </button>
  </div>
</div>

<script>
  // Remember user info
  const saved = JSON.parse(localStorage.getItem('displaySubmitter') || '{}');
  if (saved.name) document.getElementById('submitterName').value = saved.name;

  // Default to next Sunday
  const today = new Date();
  const d = (7 - today.getDay()) % 7 || 7;
  document.getElementById('serviceDate').value = new Date(today.getTime() + d * 86400000).toISOString().split('T')[0];

  let submittedCount = 0;
  const MAX_IMAGE_SIZE = 10 * 1024 * 1024; // 10MB
  const MAX_VIDEO_SIZE = 100 * 1024 * 1024; // 100MB

  // ─── Bible books data ──────────────────────────────────────────
  const BIBLE_BOOKS = [
    'Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth',
    '1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles',
    'Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes',
    'Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel',
    'Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk',
    'Zephaniah','Haggai','Zechariah','Malachi',
    'Matthew','Mark','Luke','John','Acts','Romans',
    '1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians',
    'Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy',
    'Titus','Philemon','Hebrews','James','1 Peter','2 Peter',
    '1 John','2 John','3 John','Jude','Revelation'
  ];

  let selectedVerses = [];

  // Book autocomplete
  const bookInput = document.getElementById('bookInput');
  const bookSuggestions = document.getElementById('bookSuggestions');

  bookInput.addEventListener('input', () => {
    const val = bookInput.value.toLowerCase();
    if (!val) { bookSuggestions.classList.add('hidden'); return; }
    const matches = BIBLE_BOOKS.filter(b => b.toLowerCase().startsWith(val)).slice(0, 8);
    if (matches.length === 0) { bookSuggestions.classList.add('hidden'); return; }
    bookSuggestions.innerHTML = matches.map(b =>
      '<div class="px-3 py-2 text-sm hover:bg-orange-50 cursor-pointer" onclick="selectBook(\'' + b + '\')">' + b + '</div>'
    ).join('');
    bookSuggestions.classList.remove('hidden');
  });

  bookInput.addEventListener('blur', () => {
    setTimeout(() => bookSuggestions.classList.add('hidden'), 200);
  });

  function selectBook(name) {
    bookInput.value = name;
    bookSuggestions.classList.add('hidden');
    document.getElementById('chapterInput').focus();
  }

  function addVerse() {
    const book = bookInput.value.trim();
    const ch = document.getElementById('chapterInput').value;
    const vStart = document.getElementById('verseStartInput').value;
    const vEnd = document.getElementById('verseEndInput').value;
    const version = document.getElementById('bibleVersion').value;

    if (!book || !ch) { bookInput.focus(); return; }

    let ref = book + ' ' + ch;
    if (vStart) {
      ref += ':' + vStart;
      if (vEnd && parseInt(vEnd) > parseInt(vStart)) ref += '-' + vEnd;
    }
    ref += ' (' + version + ')';

    selectedVerses.push(ref);
    renderVerseList();

    // Clear inputs for next verse
    bookInput.value = '';
    document.getElementById('chapterInput').value = '';
    document.getElementById('verseStartInput').value = '';
    document.getElementById('verseEndInput').value = '';
    bookInput.focus();
  }

  function removeVerse(idx) {
    selectedVerses.splice(idx, 1);
    renderVerseList();
  }

  function renderVerseList() {
    const list = document.getElementById('verseList');
    if (selectedVerses.length === 0) { list.innerHTML = ''; return; }
    list.innerHTML = selectedVerses.map((v, i) =>
      '<div class="flex items-center justify-between px-3 py-1.5 bg-blue-50 rounded text-sm">' +
      '<span class="text-blue-800">📖 ' + escapeHtml(v) + '</span>' +
      '<button onclick="removeVerse(' + i + ')" class="text-red-400 hover:text-red-600 text-lg leading-none">&times;</button></div>'
    ).join('');
  }

  function showForm(type) {
    const form = document.getElementById('itemForm');
    const fileRow = document.getElementById('fileRow');
    const bodyRow = document.getElementById('bodyRow');
    const subtitleRow = document.getElementById('subtitleRow');
    const fileInput = document.getElementById('itemFile');
    const bodyInput = document.getElementById('itemBody');
    const titleInput = document.getElementById('itemTitle');
    const formTitle = document.getElementById('formTitle');
    const fileSizeHint = document.getElementById('fileSizeHint');

    // Reset
    document.getElementById('formType').value = type;
    titleInput.value = '';
    bodyInput.value = '';
    document.getElementById('itemSubtitle').value = '';
    document.getElementById('itemComments').value = '';
    fileInput.value = '';
    fileRow.classList.add('hidden');
    bodyRow.classList.add('hidden');
    subtitleRow.classList.add('hidden');
    document.getElementById('scriptureRow').classList.add('hidden');
    selectedVerses = [];
    renderVerseList();

    switch (type) {
      case 'image':
        formTitle.textContent = 'Add Image / Poster';
        titleInput.placeholder = 'Title (e.g., Youth Camp Poster)';
        fileRow.classList.remove('hidden');
        fileInput.accept = 'image/*';
        fileSizeHint.textContent = 'Max 10MB. JPG, PNG, WebP supported.';
        break;
      case 'video':
        formTitle.textContent = 'Add Video';
        titleInput.placeholder = 'Title (e.g., Welcome Video)';
        fileRow.classList.remove('hidden');
        fileInput.accept = 'video/*';
        fileSizeHint.textContent = 'Max 100MB. MP4, WebM, MOV supported.';
        break;
      case 'scripture':
        formTitle.textContent = 'Add Scripture';
        titleInput.placeholder = 'Label (e.g., Opening Scripture)';
        document.getElementById('scriptureRow').classList.remove('hidden');
        break;
      case 'sermon_info':
        formTitle.textContent = 'Add Sermon Title';
        titleInput.placeholder = 'Sermon title (e.g., Walking in Faith)';
        bodyRow.classList.remove('hidden');
        bodyInput.placeholder = 'Key points or description (optional)';
        subtitleRow.classList.remove('hidden');
        break;
      case 'nugget':
        formTitle.textContent = 'Add Sermon Point';
        titleInput.placeholder = 'Label (e.g., Point 1, Key Quote)';
        bodyRow.classList.remove('hidden');
        bodyInput.placeholder = 'The text to display on screen';
        subtitleRow.classList.remove('hidden');
        break;
    }

    form.classList.remove('hidden');
    titleInput.focus();
  }

  function hideForm() {
    document.getElementById('itemForm').classList.add('hidden');
  }

  async function submitItem() {
    const name = document.getElementById('submitterName').value.trim();
    if (!name) {
      document.getElementById('infoSection').open = true;
      document.getElementById('submitterName').focus();
      alert('Please enter your name first');
      return;
    }

    const type = document.getElementById('formType').value;
    const title = document.getElementById('itemTitle').value.trim();
    if (!title) { document.getElementById('itemTitle').focus(); return; }

    // File size check
    const fileInput = document.getElementById('itemFile');
    if ((type === 'image' || type === 'video') && fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const maxSize = type === 'image' ? MAX_IMAGE_SIZE : MAX_VIDEO_SIZE;
      if (file.size > maxSize) {
        const maxMB = Math.round(maxSize / 1024 / 1024);
        alert('File is too large. Maximum size is ' + maxMB + 'MB.');
        return;
      }
    }

    // Save user info
    localStorage.setItem('displaySubmitter', JSON.stringify({ name: name }));

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const formData = new FormData();
      formData.append('submitter_name', name);
      formData.append('content_type', type);
      formData.append('title', title);
      formData.append('service_date', document.getElementById('serviceDate').value);
      formData.append('display_slot', document.getElementById('displaySlot').value);

      let body = document.getElementById('itemBody').value.trim();
      // For scripture, use the selected verses list
      if (type === 'scripture' && selectedVerses.length > 0) {
        body = selectedVerses.join('\n');
      }
      if (body) formData.append('body', body);

      const subtitle = document.getElementById('itemSubtitle').value.trim();
      if (subtitle) formData.append('subtitle', subtitle);

      const comments = document.getElementById('itemComments').value.trim();
      if (comments) formData.append('comments', comments);

      if (fileInput.files.length > 0) {
        formData.append('file', fileInput.files[0]);
      }

      const resp = await fetch('/api/display/submit', { method: 'POST', body: formData });
      const data = await resp.json();

      if (resp.ok && data.status === 'success') {
        // Show success
        showToast();
        addToSubmittedList(type, title);
        hideForm();
      } else {
        alert(data.detail || 'Failed to submit. Please try again.');
      }
    } catch (err) {
      alert('Network error. Please check your connection.');
    }

    btn.disabled = false;
    btn.textContent = 'Add Item';
  }

  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2000);
  }

  function addToSubmittedList(type, title) {
    submittedCount++;
    const list = document.getElementById('submittedList');
    const items = document.getElementById('submittedItems');
    const count = document.getElementById('submittedCount');

    list.classList.remove('hidden');
    count.textContent = submittedCount;

    const icons = { image: '🖼️', video: '🎬', scripture: '📖', sermon_info: '📝', nugget: '⚡' };
    const labels = { image: 'Image', video: 'Video', scripture: 'Scripture', sermon_info: 'Sermon', nugget: 'Nugget' };

    items.innerHTML += '<div class="flex items-center gap-2 px-3 py-2 bg-green-50 rounded-md text-sm">' +
      '<span>' + (icons[type] || '📄') + '</span>' +
      '<span class="font-medium text-green-800">' + escapeHtml(title) + '</span>' +
      '<span class="text-xs text-green-600 ml-auto">' + (labels[type] || type) + '</span>' +
      '<span class="text-green-500">✓</span></div>';
  }

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }
</script>
{% endblock %}
