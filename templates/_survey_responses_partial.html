<div class="max-w-5xl mx-auto px-4 py-6" x-data="surveyResponses()" x-init="init()">

    <a :href="config.listUrl" class="text-gray-400 hover:text-gray-600 text-sm" x-text="`← ${config.backLabel}`"></a>

    <div class="mt-3 flex items-start justify-between gap-3 flex-wrap">
        <div>
            <h1 class="text-2xl font-bold text-gray-900" x-text="data?.survey?.title || ''"></h1>
            <p class="text-sm text-gray-500" x-show="data?.is_anonymous">Anonymous survey · responses below carry no identity.</p>
        </div>
        <div class="text-right">
            <div class="text-3xl font-bold text-indigo-600" x-text="data?.total || 0"></div>
            <div class="text-xs text-gray-500 uppercase tracking-wider">responses</div>
        </div>
    </div>

    <div x-show="loading" class="mt-6 text-sm text-gray-500">Loading…</div>

    <div x-show="!loading && data" class="mt-6 space-y-6">

        <!-- Summary cards -->
        <div class="space-y-4">
            <template x-for="qsum in (data?.summaries || [])" :key="qsum.question_id">
                <div class="bg-white border border-gray-200 rounded-xl p-4">
                    <div class="font-medium text-gray-900 mb-2" x-text="qsum.question_text"></div>
                    <div class="text-xs text-gray-500 mb-3 uppercase tracking-wider" x-text="qsum.question_type.replace('_', ' ')"></div>

                    <template x-if="qsum.counts">
                        <div class="space-y-2">
                            <template x-for="[opt, n] in Object.entries(qsum.counts).sort((a,b) => b[1] - a[1])" :key="opt">
                                <div>
                                    <div class="flex justify-between text-sm">
                                        <span x-text="opt"></span>
                                        <span class="font-medium text-gray-700" x-text="n"></span>
                                    </div>
                                    <div class="h-2 bg-gray-100 rounded mt-1 overflow-hidden">
                                        <div class="h-full bg-indigo-500" :style="`width:${pct(n, qsum.counts)}%`"></div>
                                    </div>
                                </div>
                            </template>
                            <div x-show="!Object.keys(qsum.counts).length" class="text-xs text-gray-400 italic">No answers yet.</div>
                        </div>
                    </template>

                    <template x-if="qsum.samples">
                        <div class="space-y-1 max-h-60 overflow-y-auto">
                            <template x-for="s in qsum.samples" :key="s">
                                <div class="text-sm text-gray-700 p-2 bg-gray-50 rounded" x-text="s"></div>
                            </template>
                            <div x-show="!qsum.samples.length" class="text-xs text-gray-400 italic">No answers yet.</div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Individual responses table -->
        <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-100 bg-gray-50 font-semibold text-gray-900">Individual responses</div>
            <div class="divide-y divide-gray-100" x-show="(data?.responses || []).length">
                <template x-for="r in (data?.responses || [])" :key="r.id">
                    <details class="group">
                        <summary class="px-4 py-3 cursor-pointer hover:bg-gray-50 flex justify-between text-sm">
                            <span x-text="formatDate(r.submitted_at)"></span>
                            <span class="text-gray-500" x-text="data.is_anonymous ? 'Anonymous' : (r.respondent_name || '—')"></span>
                        </summary>
                        <div class="px-4 py-3 bg-gray-50/50 space-y-2">
                            <template x-for="q in (data.survey?.questions || [])" :key="q.id">
                                <div>
                                    <div class="text-xs font-medium text-gray-600" x-text="q.question_text"></div>
                                    <div class="text-sm text-gray-900" x-text="formatAnswer(r.answers[q.id])"></div>
                                </div>
                            </template>
                        </div>
                    </details>
                </template>
            </div>
            <div x-show="!(data?.responses || []).length" class="p-6 text-center text-sm text-gray-500">No responses yet.</div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function surveyResponses() {
    return {
        config: window.__SURVEY_RESPONSES_CONFIG__ || {listUrl: '/surveys', backLabel: 'Back'},
        loading: true,
        data: null,

        async init() {
            const m = location.pathname.match(/\/surveys\/(\d+)\/responses/);
            const id = m ? m[1] : null;
            if (!id) { this.loading = false; return; }
            try {
                const res = await fetch(`/api/surveys/${id}/responses`);
                if (!res.ok) { alert('Could not load responses'); this.loading = false; return; }
                this.data = await res.json();
            } catch (e) { console.error(e); }
            this.loading = false;
        },

        pct(n, counts) {
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            return total ? Math.round((n / total) * 100) : 0;
        },

        formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString();
        },

        formatAnswer(a) {
            if (!a) return '—';
            if (a.answer_options && a.answer_options.length) return a.answer_options.join(', ');
            return a.answer_text || '—';
        },
    };
}
</script>
