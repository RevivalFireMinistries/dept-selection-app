{% extends "admin/base.html" %}

{% block title %}Announcements · Admin{% endblock %}

{% block admin_content %}
<div class="max-w-4xl mx-auto px-4 py-6" x-data="announcementsAdmin()" x-init="load()">

    <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">📣 Announcements</h1>
            <p class="text-sm text-gray-500">Short messages shown on the member portal Home tab.</p>
        </div>
        <button @click="openEditor(null)" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-medium rounded-lg">+ New announcement</button>
    </div>

    <div x-show="message" class="mb-3 p-3 rounded-lg text-sm" :class="messageError ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'" x-text="message"></div>

    <div x-show="loading" class="p-8 text-center text-sm text-gray-500">Loading…</div>
    <div x-show="!loading && !rows.length" class="p-8 text-center text-sm text-gray-500 bg-white rounded-xl border border-gray-100">No announcements yet.</div>

    <div class="space-y-2">
        <template x-for="a in rows" :key="a.id">
            <div class="bg-white border border-gray-200 rounded-xl p-4">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center flex-wrap gap-2">
                            <span class="font-semibold text-gray-900" x-text="a.title"></span>
                            <span x-show="a.pinned" class="text-[10px] px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded font-semibold uppercase">Pinned</span>
                            <span class="text-[10px] px-2 py-0.5 font-semibold rounded uppercase" :class="visibilityBadgeClass(a)" x-text="visibilityLabel(a)"></span>
                        </div>
                        <div x-show="a.body" class="text-sm text-gray-600 mt-1 whitespace-pre-wrap" x-text="a.body"></div>
                        <div x-show="a.link_url" class="text-xs text-indigo-600 mt-1 truncate">→ <span x-text="a.link_label || a.link_url"></span></div>
                        <div class="text-[11px] text-gray-400 mt-1">
                            <span x-show="a.starts_at" x-text="`From ${formatDate(a.starts_at)}`"></span>
                            <span x-show="a.starts_at && a.ends_at"> · </span>
                            <span x-show="a.ends_at" x-text="`Until ${formatDate(a.ends_at)}`"></span>
                            <span x-show="!a.starts_at && !a.ends_at">Always visible while active</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button @click="togglePin(a)" class="px-3 py-1.5 text-xs border border-gray-300 text-gray-700 rounded" x-text="a.pinned ? 'Unpin' : 'Pin'"></button>
                        <button @click="toggleActive(a)" class="px-3 py-1.5 text-xs border border-gray-300 text-gray-700 rounded" x-text="a.is_active ? 'Hide' : 'Show'"></button>
                        <button @click="openEditor(a)" class="px-3 py-1.5 text-xs bg-yellow-600 text-white rounded">Edit</button>
                        <button @click="deleteOne(a)" class="px-2 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded">Delete</button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Editor sheet -->
    <div x-show="editorOpen" x-cloak class="fixed inset-0 z-50 flex items-end sm:items-center justify-center" @click.self="editorOpen = false">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="relative w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-100 px-5 py-4 flex items-center justify-between">
                <div class="font-semibold text-gray-900" x-text="form.id ? 'Edit announcement' : 'New announcement'"></div>
                <button @click="editorOpen = false" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center">✕</button>
            </div>
            <div class="p-5 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                    <input type="text" x-model="form.title" maxlength="200" placeholder="e.g. Conference registrations open" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Body <span class="font-normal text-gray-400">(optional)</span></label>
                    <textarea x-model="form.body" rows="4" placeholder="A short message — keep it brief." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Starts</label>
                        <input type="datetime-local" x-model="form.starts_at" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Ends</label>
                        <input type="datetime-local" x-model="form.ends_at" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Link URL <span class="font-normal text-gray-400">(optional)</span></label>
                        <input type="url" x-model="form.link_url" placeholder="https://..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Link label</label>
                        <input type="text" x-model="form.link_label" maxlength="80" placeholder="Read more" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-4 pt-1">
                    <label class="inline-flex items-center gap-2 text-sm">
                        <input type="checkbox" x-model="form.pinned" class="rounded text-yellow-600" />
                        <span>Pin to top</span>
                    </label>
                    <label class="inline-flex items-center gap-2 text-sm">
                        <input type="checkbox" x-model="form.is_active" class="rounded text-yellow-600" />
                        <span>Active</span>
                    </label>
                </div>

                <div x-show="formError" class="p-2 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700" x-text="formError"></div>

                <div class="flex justify-end gap-2 pt-2">
                    <button @click="editorOpen = false" class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-50 rounded-lg">Cancel</button>
                    <button @click="save()" :disabled="saving" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-medium rounded-lg disabled:opacity-50" x-text="saving ? 'Saving…' : (form.id ? 'Save changes' : 'Publish')"></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function announcementsAdmin() {
    return {
        loading: true,
        rows: [],
        message: '',
        messageError: false,
        editorOpen: false,
        saving: false,
        formError: '',
        form: { id: null, title: '', body: '', pinned: false, is_active: true, starts_at: '', ends_at: '', link_url: '', link_label: '' },

        async load() {
            this.loading = true;
            try {
                const res = await fetch('/api/admin/announcements');
                if (!res.ok) { this.rows = []; return; }
                this.rows = await res.json();
            } catch (e) { console.error(e); }
            this.loading = false;
        },

        flash(text, isError) {
            this.message = text; this.messageError = !!isError;
            setTimeout(() => { this.message = ''; }, 3500);
        },

        formatDate(iso) {
            if (!iso) return '';
            try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
        },

        visibilityLabel(a) {
            if (!a.is_active) return 'Hidden';
            const now = Date.now();
            if (a.starts_at && new Date(a.starts_at).getTime() > now) return 'Scheduled';
            if (a.ends_at && new Date(a.ends_at).getTime() < now) return 'Expired';
            return 'Live';
        },
        visibilityBadgeClass(a) {
            const label = this.visibilityLabel(a);
            return ({
                'Live':      'bg-emerald-100 text-emerald-700',
                'Scheduled': 'bg-blue-100 text-blue-700',
                'Expired':   'bg-gray-100 text-gray-700',
                'Hidden':    'bg-gray-100 text-gray-500',
            })[label] || 'bg-gray-100 text-gray-700';
        },

        _toLocalInput(iso) {
            if (!iso) return '';
            // datetime-local expects "YYYY-MM-DDTHH:MM"
            const d = new Date(iso);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        },

        openEditor(a) {
            if (a) {
                this.form = {
                    id: a.id, title: a.title, body: a.body || '',
                    pinned: !!a.pinned, is_active: !!a.is_active,
                    starts_at: this._toLocalInput(a.starts_at),
                    ends_at: this._toLocalInput(a.ends_at),
                    link_url: a.link_url || '', link_label: a.link_label || '',
                };
            } else {
                this.form = { id: null, title: '', body: '', pinned: false, is_active: true, starts_at: '', ends_at: '', link_url: '', link_label: '' };
            }
            this.formError = '';
            this.editorOpen = true;
        },

        async save() {
            this.formError = '';
            if (!this.form.title.trim()) { this.formError = 'Title is required'; return; }
            this.saving = true;
            const payload = {
                title: this.form.title,
                body: this.form.body,
                pinned: this.form.pinned,
                is_active: this.form.is_active,
                starts_at: this.form.starts_at || null,
                ends_at: this.form.ends_at || null,
                link_url: this.form.link_url,
                link_label: this.form.link_label,
            };
            try {
                const url = this.form.id ? `/api/admin/announcements/${this.form.id}` : '/api/admin/announcements';
                const method = this.form.id ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (!res.ok) { this.formError = data.detail || 'Save failed'; this.saving = false; return; }
                this.editorOpen = false;
                this.flash(this.form.id ? 'Saved.' : 'Published.', false);
                await this.load();
            } catch (e) { this.formError = String(e); }
            this.saving = false;
        },

        async togglePin(a) {
            const res = await fetch(`/api/admin/announcements/${a.id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ pinned: !a.pinned }) });
            if (res.ok) { a.pinned = !a.pinned; this.rows.sort((x, y) => (y.pinned - x.pinned)); }
        },

        async toggleActive(a) {
            const res = await fetch(`/api/admin/announcements/${a.id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ is_active: !a.is_active }) });
            if (res.ok) { a.is_active = !a.is_active; }
        },

        async deleteOne(a) {
            if (!confirm(`Delete "${a.title}"?`)) return;
            const res = await fetch(`/api/admin/announcements/${a.id}`, { method: 'DELETE' });
            if (res.ok) { this.rows = this.rows.filter(x => x.id !== a.id); this.flash('Deleted.', false); }
            else { this.flash('Delete failed', true); }
        },
    };
}
</script>
{% endblock %}
