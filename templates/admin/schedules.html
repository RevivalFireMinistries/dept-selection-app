{% extends "admin/base.html" %}

{% block title %}Service Schedule - Admin{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-bold text-gray-900">Service Schedule</h1>
            <p class="text-sm text-gray-500">Plan upcoming services and assign service managers</p>
        </div>
        <button onclick="showCreateForm()" class="px-4 py-2 bg-teal-600 text-white text-sm font-medium rounded-xl">+ Schedule</button>
    </div>

    <div id="schedulesList" class="space-y-3">
        <div class="text-center py-12 text-gray-400 text-sm">Loading...</div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="formOverlay" class="fixed inset-0 bg-black/40 z-50 hidden" onclick="closeForm()">
    <div class="fixed inset-x-0 bottom-0 bg-white rounded-t-2xl max-h-[85vh] overflow-y-auto safe-bottom" onclick="event.stopPropagation()">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between rounded-t-2xl z-10">
            <h2 id="formTitle" class="font-bold text-gray-900">Schedule Service</h2>
            <button onclick="closeForm()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="p-4 space-y-4">
            <input type="hidden" id="editId">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service Date *</label>
                <input type="date" id="serviceDate" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Template</label>
                <select id="templateSelect" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                    <option value="">Select template...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service Manager *</label>
                <div class="relative">
                    <input type="text" id="managerSearch" placeholder="Search by name or phone..." autocomplete="off"
                           class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
                           oninput="searchManagers(this.value)">
                    <input type="hidden" id="managerId">
                    <div id="managerDropdown" class="absolute top-full left-0 right-0 z-50 bg-white border border-gray-200 rounded-b-xl max-h-48 overflow-y-auto hidden shadow-lg"></div>
                </div>
                <div id="selectedManager" class="hidden mt-2 px-3 py-2 bg-teal-50 border border-teal-200 rounded-lg flex items-center justify-between">
                    <span id="selectedManagerName" class="text-sm font-medium text-teal-800"></span>
                    <button onclick="clearManager()" class="text-teal-600 hover:text-teal-800 text-xs font-medium">Change</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea id="scheduleNotes" rows="2" placeholder="Optional notes..." class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500"></textarea>
            </div>

            <button onclick="saveSchedule()" class="w-full py-3 bg-teal-600 text-white font-medium rounded-xl text-sm">Save</button>
        </div>
    </div>
</div>

<script>
let allMembers = [];
let allTemplates = [];
let schedules = [];

async function init() {
    const [membersRes, templatesRes] = await Promise.all([
        fetch('/api/admin/reviews'),
        fetch('/api/admin/templates')
    ]);
    const membersData = await membersRes.json();
    allMembers = membersData.map(m => ({
        id: m.id,
        name: m.titledName || m.fullName || m.full_name,
        phone: m.phone
    }));
    allTemplates = await templatesRes.json();

    // Populate template select
    const sel = document.getElementById('templateSelect');
    allTemplates.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = `${t.name} (${t.day_of_week})`;
        sel.appendChild(opt);
    });

    loadSchedules();
}

async function loadSchedules() {
    const res = await fetch('/api/admin/schedules');
    schedules = await res.json();
    renderSchedules();
}

function renderSchedules() {
    const container = document.getElementById('schedulesList');

    if (schedules.length === 0) {
        container.innerHTML = `
            <div class="text-center py-16">
                <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-gray-100 flex items-center justify-center">
                    <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <p class="text-gray-500 text-sm mb-1">No upcoming services scheduled</p>
                <p class="text-gray-400 text-xs">Tap "+ Schedule" to plan a service</p>
            </div>`;
        return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    container.innerHTML = schedules.map(s => {
        const svcDate = new Date(s.service_date + 'T00:00:00');
        const daysUntil = Math.ceil((svcDate - today) / (1000*60*60*24));
        const dateStr = svcDate.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

        let statusBadge = '';
        let statusColor = '';
        if (s.has_program && s.program_status === 'published') {
            statusBadge = '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-full">Published</span>';
            statusColor = 'border-l-emerald-400';
        } else if (s.has_program) {
            statusBadge = '<span class="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs font-semibold rounded-full">Draft</span>';
            statusColor = 'border-l-amber-400';
        } else if (daysUntil <= 2) {
            statusBadge = '<span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-semibold rounded-full">Overdue</span>';
            statusColor = 'border-l-red-400';
        } else if (s.notified_at) {
            statusBadge = '<span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full">Notified</span>';
            statusColor = 'border-l-blue-400';
        } else {
            statusBadge = '<span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-xs font-semibold rounded-full">Pending</span>';
            statusColor = 'border-l-gray-300';
        }

        const countdownText = daysUntil === 0 ? 'Today' : daysUntil === 1 ? 'Tomorrow' : `${daysUntil} days`;

        return `
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 border-l-4 ${statusColor}">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                        <span class="font-semibold text-gray-900 text-sm">${s.day_of_week}</span>
                        <span class="text-xs text-gray-400">&middot;</span>
                        <span class="text-xs text-gray-500">${dateStr}</span>
                        ${statusBadge}
                    </div>
                    <div class="flex items-center gap-3 text-xs text-gray-500 mt-1">
                        <span class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            ${escapeHtml(s.service_manager_name || 'Unassigned')}
                        </span>
                        ${s.template_name ? `<span class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"/></svg>
                            ${escapeHtml(s.template_name)}
                        </span>` : ''}
                        <span class="font-medium ${daysUntil <= 2 ? 'text-red-600' : (daysUntil <= 5 ? 'text-amber-600' : 'text-gray-400')}">${countdownText}</span>
                    </div>
                    ${s.notes ? `<p class="text-xs text-gray-400 mt-1 italic">${escapeHtml(s.notes)}</p>` : ''}
                </div>
                <div class="flex gap-1 flex-shrink-0">
                    <button onclick='editSchedule(${JSON.stringify(s).replace(/'/g, "&#39;")})' class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100" title="Edit">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button onclick="deleteSchedule(${s.id})" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50" title="Delete">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// --- Form ---

function showCreateForm() {
    document.getElementById('editId').value = '';
    document.getElementById('formTitle').textContent = 'Schedule Service';
    document.getElementById('serviceDate').value = '';
    document.getElementById('templateSelect').value = '';
    document.getElementById('managerId').value = '';
    document.getElementById('managerSearch').value = '';
    document.getElementById('selectedManager').classList.add('hidden');
    document.getElementById('managerSearch').parentElement.querySelector('input[type=text]').classList.remove('hidden');
    document.getElementById('scheduleNotes').value = '';
    document.getElementById('formOverlay').classList.remove('hidden');
}

function editSchedule(s) {
    document.getElementById('editId').value = s.id;
    document.getElementById('formTitle').textContent = 'Edit Schedule';
    document.getElementById('serviceDate').value = s.service_date;
    document.getElementById('templateSelect').value = s.template_id || '';
    document.getElementById('managerId').value = s.service_manager_id || '';
    document.getElementById('scheduleNotes').value = s.notes || '';

    if (s.service_manager_name) {
        document.getElementById('managerSearch').classList.add('hidden');
        document.getElementById('selectedManager').classList.remove('hidden');
        document.getElementById('selectedManagerName').textContent = s.service_manager_name;
    }

    document.getElementById('formOverlay').classList.remove('hidden');
}

function closeForm() {
    document.getElementById('formOverlay').classList.add('hidden');
}

function searchManagers(query) {
    const dropdown = document.getElementById('managerDropdown');
    if (!query || query.length < 2) { dropdown.classList.add('hidden'); return; }

    const q = query.toLowerCase();
    const matches = allMembers.filter(m =>
        (m.name && m.name.toLowerCase().includes(q)) ||
        (m.phone && m.phone.includes(q))
    ).slice(0, 8);

    if (matches.length === 0) { dropdown.classList.add('hidden'); return; }

    dropdown.innerHTML = matches.map(m => `
        <div class="px-3 py-2.5 cursor-pointer hover:bg-teal-50 text-sm" onclick="selectManager(${m.id}, '${escapeHtml(m.name)}')">
            <span class="font-medium">${escapeHtml(m.name)}</span>
            <span class="text-gray-400 ml-2 text-xs">${m.phone || ''}</span>
        </div>
    `).join('');
    dropdown.classList.remove('hidden');
}

function selectManager(id, name) {
    document.getElementById('managerId').value = id;
    document.getElementById('managerSearch').classList.add('hidden');
    document.getElementById('selectedManager').classList.remove('hidden');
    document.getElementById('selectedManagerName').textContent = name;
    document.getElementById('managerDropdown').classList.add('hidden');
}

function clearManager() {
    document.getElementById('managerId').value = '';
    document.getElementById('managerSearch').value = '';
    document.getElementById('managerSearch').classList.remove('hidden');
    document.getElementById('selectedManager').classList.add('hidden');
}

async function saveSchedule() {
    const editId = document.getElementById('editId').value;
    const serviceDate = document.getElementById('serviceDate').value;
    const templateId = document.getElementById('templateSelect').value;
    const managerId = document.getElementById('managerId').value;
    const notes = document.getElementById('scheduleNotes').value;

    if (!serviceDate) return alert('Please select a date');
    if (!managerId) return alert('Please select a service manager');

    const payload = {
        service_date: serviceDate,
        template_id: templateId ? parseInt(templateId) : null,
        service_manager_id: parseInt(managerId),
        notes: notes || null
    };

    const url = editId ? `/api/admin/schedules/${editId}` : '/api/admin/schedules';
    const method = editId ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        closeForm();
        loadSchedules();
    } else {
        const err = await res.json();
        alert(err.detail || 'Failed to save');
    }
}

async function deleteSchedule(id) {
    if (!confirm('Delete this schedule?')) return;
    const res = await fetch(`/api/admin/schedules/${id}`, { method: 'DELETE' });
    if (res.ok) loadSchedules();
    else alert('Failed to delete');
}

init();
</script>
{% endblock %}
