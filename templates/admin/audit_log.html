{% extends "admin/base.html" %}

{% block title %}Audit Log - Admin{% endblock %}

{% block admin_content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-900">Audit Log</h2>
        <span class="text-sm text-gray-500" id="totalCount"></span>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-3">
        <select id="filterAction" onchange="loadLogs()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            <option value="">All Actions</option>
        </select>
        <select id="filterAdmin" onchange="loadLogs()" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
            <option value="">All Admins</option>
        </select>
    </div>

    <!-- Loading -->
    <div id="loading" class="flex justify-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
    </div>

    <!-- Log Entries -->
    <div id="logList" class="space-y-2 hidden"></div>

    <!-- Load More -->
    <div id="loadMore" class="hidden text-center py-4">
        <button onclick="loadMoreLogs()" class="px-6 py-2.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200">
            Load More
        </button>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12 text-gray-400">
        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p class="text-sm">No audit log entries yet</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allLogs = [];
let displayOffset = 0;
const PAGE_SIZE = 50;

const actionLabels = {
    'admin_login': 'Logged In',
    'approve_member': 'Approved Member',
    'reject_member': 'Rejected Member',
    'delete_member': 'Deleted Member',
    'create_member': 'Created Member',
    'update_member': 'Updated Member',
    'assign_department': 'Assigned Department',
    'review_approve': 'Approved Selection',
    'review_reject': 'Rejected Selection',
    'review_replace': 'Replaced Selection',
    'bulk_approve': 'Bulk Approved',
    'publish_results': 'Published Results',
    'unpublish_results': 'Unpublished Results',
    'resolve_appeal': 'Resolved Appeal',
    'toggle_appeal_window': 'Toggled Appeal Window',
    'update_leadership_roles': 'Updated Roles',
    'update_settings': 'Updated Settings',
    'create_meeting': 'Created Meeting',
    'update_meeting': 'Updated Meeting',
    'delete_meeting': 'Deleted Meeting',
    'create_program': 'Created Program',
    'update_program': 'Updated Program',
    'delete_program': 'Deleted Program',
    'create_template': 'Created Template',
    'update_template': 'Updated Template',
    'delete_template': 'Deleted Template',
    'create_schedule': 'Created Schedule',
    'update_schedule': 'Updated Schedule',
    'delete_schedule': 'Deleted Schedule',
    'purge_songs': 'Purged Songs',
    'set_hod': 'Set HOD',
    'remove_hod': 'Removed HOD'
};

const actionColors = {
    'admin_login': 'bg-blue-100 text-blue-700',
    'approve_member': 'bg-green-100 text-green-700',
    'reject_member': 'bg-red-100 text-red-700',
    'delete_member': 'bg-red-100 text-red-700',
    'publish_results': 'bg-emerald-100 text-emerald-700',
    'unpublish_results': 'bg-amber-100 text-amber-700',
    'bulk_approve': 'bg-green-100 text-green-700',
};

document.addEventListener('DOMContentLoaded', loadLogs);

async function loadLogs() {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('logList').classList.add('hidden');
    displayOffset = 0;

    try {
        const res = await fetch(`/api/admin/audit-log?limit=500`);
        const data = await res.json();
        allLogs = data.logs;

        // Populate filter dropdowns
        populateFilters();
        renderLogs();

        document.getElementById('totalCount').textContent = `${data.total} entries`;
    } catch (e) {
        console.error('Failed to load audit log:', e);
    }

    document.getElementById('loading').classList.add('hidden');
}

function populateFilters() {
    const actions = [...new Set(allLogs.map(l => l.action))].sort();
    const admins = [...new Set(allLogs.map(l => l.admin_name))].sort();

    const actionSelect = document.getElementById('filterAction');
    const currentAction = actionSelect.value;
    actionSelect.innerHTML = '<option value="">All Actions</option>' +
        actions.map(a => `<option value="${a}" ${a === currentAction ? 'selected' : ''}>${actionLabels[a] || a}</option>`).join('');

    const adminSelect = document.getElementById('filterAdmin');
    const currentAdmin = adminSelect.value;
    adminSelect.innerHTML = '<option value="">All Admins</option>' +
        admins.map(a => `<option value="${a}" ${a === currentAdmin ? 'selected' : ''}>${a}</option>`).join('');
}

function getFilteredLogs() {
    const actionFilter = document.getElementById('filterAction').value;
    const adminFilter = document.getElementById('filterAdmin').value;

    return allLogs.filter(l => {
        if (actionFilter && l.action !== actionFilter) return false;
        if (adminFilter && l.admin_name !== adminFilter) return false;
        return true;
    });
}

function renderLogs() {
    const filtered = getFilteredLogs();
    const list = document.getElementById('logList');
    const empty = document.getElementById('emptyState');
    const loadMoreBtn = document.getElementById('loadMore');

    if (filtered.length === 0) {
        list.classList.add('hidden');
        empty.classList.remove('hidden');
        loadMoreBtn.classList.add('hidden');
        return;
    }

    empty.classList.add('hidden');
    list.classList.remove('hidden');

    const toShow = filtered.slice(0, PAGE_SIZE);
    displayOffset = PAGE_SIZE;

    list.innerHTML = toShow.map(renderLogEntry).join('');
    loadMoreBtn.classList.toggle('hidden', filtered.length <= PAGE_SIZE);
}

function loadMoreLogs() {
    const filtered = getFilteredLogs();
    const list = document.getElementById('logList');
    const loadMoreBtn = document.getElementById('loadMore');

    const nextBatch = filtered.slice(displayOffset, displayOffset + PAGE_SIZE);
    displayOffset += PAGE_SIZE;

    list.innerHTML += nextBatch.map(renderLogEntry).join('');
    loadMoreBtn.classList.toggle('hidden', displayOffset >= filtered.length);
}

function renderLogEntry(l) {
    const colorClass = actionColors[l.action] || 'bg-gray-100 text-gray-700';
    const label = actionLabels[l.action] || l.action;
    const date = new Date(l.created_at);
    const timeStr = date.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }) +
        ' ' + date.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });

    return `
        <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0 mt-0.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-semibold text-gray-900">${escapeHtml(l.admin_name)}</span>
                    <span class="px-2 py-0.5 text-xs font-medium rounded-full ${colorClass}">${label}</span>
                </div>
                ${l.details ? `<p class="text-sm text-gray-600 mt-1">${escapeHtml(l.details)}</p>` : ''}
                <p class="text-xs text-gray-400 mt-1">${timeStr}${l.ip_address ? ' &middot; ' + l.ip_address : ''}</p>
            </div>
        </div>
    `;
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
{% endblock %}
