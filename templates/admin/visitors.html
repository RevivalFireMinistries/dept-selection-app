{% extends "admin/base.html" %}

{% block title %}First-Time Visitors - Admin{% endblock %}

{% block admin_content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">First-Time Visitors</h2>
            <p class="text-gray-600 mt-1">Manage and follow up with visitors</p>
        </div>
        <button onclick="openAddModal()" class="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition-colors">
            Add Visitor
        </button>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow p-4">
        <div class="flex flex-wrap gap-4 items-center">
            <div class="flex gap-2">
                <button onclick="filterVisitors('all')" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium" data-filter="all">
                    All
                </button>
                <button onclick="filterVisitors('unconverted')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="unconverted">
                    Not Yet Members
                </button>
                <button onclick="filterVisitors('converted')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium" data-filter="converted">
                    Converted
                </button>
            </div>
            <div class="flex-1">
                <input type="text" id="searchInput" placeholder="Search by name or phone..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                    onkeyup="searchVisitors()">
            </div>
        </div>
    </div>

    <!-- Visitors List -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div id="visitorsContainer" class="divide-y divide-gray-200">
            <div class="p-8 text-center text-gray-500">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-600 mx-auto mb-3"></div>
                Loading visitors...
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Visitor Modal -->
<div id="visitorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4 p-6">
        <h3 id="modalTitle" class="text-lg font-semibold text-gray-900 mb-4">Add Visitor</h3>
        <form id="visitorForm" onsubmit="saveVisitor(event)">
            <input type="hidden" id="visitorId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" id="visitorName" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" id="visitorPhone"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="visitorEmail"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <textarea id="visitorAddress" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Visit Date *</label>
                    <input type="date" id="visitorFirstVisit" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                    <textarea id="visitorNotes" rows="2" placeholder="How they heard about us, prayer requests, etc."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"></textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    Cancel
                </button>
                <button type="submit" class="flex-1 px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .filter-btn {
        @apply bg-gray-100 text-gray-600 hover:bg-gray-200;
    }
    .filter-btn.active {
        @apply bg-amber-600 text-white hover:bg-amber-700;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
let allVisitors = [];
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', loadVisitors);

async function loadVisitors() {
    try {
        const response = await fetch('/api/visitors');
        allVisitors = await response.json();
        renderVisitors();
    } catch (error) {
        console.error('Failed to load visitors:', error);
        document.getElementById('visitorsContainer').innerHTML = `
            <div class="p-8 text-center text-red-500">Failed to load visitors</div>
        `;
    }
}

function filterVisitors(filter) {
    currentFilter = filter;

    // Update button states
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === filter) btn.classList.add('active');
    });

    renderVisitors();
}

function searchVisitors() {
    renderVisitors();
}

function renderVisitors() {
    const container = document.getElementById('visitorsContainer');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allVisitors.filter(visitor => {
        // Apply filter
        if (currentFilter === 'converted' && !visitor.converted_to_member_id) return false;
        if (currentFilter === 'unconverted' && visitor.converted_to_member_id) return false;

        // Apply search
        if (searchQuery) {
            const name = (visitor.full_name || '').toLowerCase();
            const phone = (visitor.phone || '').toLowerCase();
            if (!name.includes(searchQuery) && !phone.includes(searchQuery)) return false;
        }

        return true;
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="p-8 text-center text-gray-500">
                <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
                <p>No visitors found</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(visitor => `
        <div class="p-4 ${visitor.converted_to_member_id ? 'bg-green-50' : ''}">
            <div class="flex items-start justify-between">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-full ${visitor.converted_to_member_id ? 'bg-green-100' : 'bg-amber-100'} flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 ${visitor.converted_to_member_id ? 'text-green-600' : 'text-amber-600'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            ${visitor.converted_to_member_id ?
                                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>' :
                                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>'
                            }
                        </svg>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">${visitor.full_name}</p>
                        <p class="text-sm text-gray-500">
                            ${visitor.phone || 'No phone'} ${visitor.email ? '| ' + visitor.email : ''}
                        </p>
                        <p class="text-xs text-gray-400 mt-1">First visit: ${formatDate(visitor.first_visit_date)}</p>
                        ${visitor.notes ? `<p class="text-sm text-gray-600 mt-2 italic">"${visitor.notes}"</p>` : ''}
                        ${visitor.converted_to_member_id ?
                            '<span class="inline-block mt-2 px-2 py-1 bg-green-200 text-green-800 text-xs rounded-full">Converted to Member</span>' : ''
                        }
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    ${!visitor.converted_to_member_id ? `
                        <button onclick="convertToMember(${visitor.id}, '${visitor.full_name}')"
                            class="px-3 py-1 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700">
                            Convert to Member
                        </button>
                    ` : ''}
                    <button onclick="editVisitor(${JSON.stringify(visitor).replace(/"/g, '&quot;')})"
                        class="p-2 text-gray-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Add Visitor';
    document.getElementById('visitorId').value = '';
    document.getElementById('visitorName').value = '';
    document.getElementById('visitorPhone').value = '';
    document.getElementById('visitorEmail').value = '';
    document.getElementById('visitorAddress').value = '';
    document.getElementById('visitorFirstVisit').value = new Date().toISOString().split('T')[0];
    document.getElementById('visitorNotes').value = '';
    document.getElementById('visitorModal').classList.remove('hidden');
    document.getElementById('visitorModal').classList.add('flex');
}

function editVisitor(visitor) {
    document.getElementById('modalTitle').textContent = 'Edit Visitor';
    document.getElementById('visitorId').value = visitor.id;
    document.getElementById('visitorName').value = visitor.full_name;
    document.getElementById('visitorPhone').value = visitor.phone || '';
    document.getElementById('visitorEmail').value = visitor.email || '';
    document.getElementById('visitorAddress').value = visitor.address || '';
    document.getElementById('visitorFirstVisit').value = visitor.first_visit_date;
    document.getElementById('visitorNotes').value = visitor.notes || '';
    document.getElementById('visitorModal').classList.remove('hidden');
    document.getElementById('visitorModal').classList.add('flex');
}

function closeModal() {
    document.getElementById('visitorModal').classList.add('hidden');
    document.getElementById('visitorModal').classList.remove('flex');
}

async function saveVisitor(event) {
    event.preventDefault();

    const id = document.getElementById('visitorId').value;
    const data = {
        full_name: document.getElementById('visitorName').value,
        phone: document.getElementById('visitorPhone').value || null,
        email: document.getElementById('visitorEmail').value || null,
        address: document.getElementById('visitorAddress').value || null,
        first_visit_date: document.getElementById('visitorFirstVisit').value,
        notes: document.getElementById('visitorNotes').value || null
    };

    try {
        const url = id ? `/api/visitors/${id}` : '/api/visitors';
        const method = id ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            closeModal();
            loadVisitors();
        } else {
            const error = await response.json();
            alert(error.detail || 'Failed to save visitor');
        }
    } catch (error) {
        alert('Failed to save visitor');
    }
}

async function convertToMember(visitorId, visitorName) {
    if (!confirm(`Convert "${visitorName}" to a member? This will create a new member record.`)) {
        return;
    }

    try {
        const response = await fetch(`/api/visitors/${visitorId}/convert`, {
            method: 'POST'
        });

        if (response.ok) {
            const result = await response.json();
            alert(`${visitorName} has been converted to a member!`);
            loadVisitors();
        } else {
            const error = await response.json();
            alert(error.detail || 'Failed to convert visitor');
        }
    } catch (error) {
        alert('Failed to convert visitor');
    }
}

// Close modal on backdrop click
document.getElementById('visitorModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
});
</script>
{% endblock %}
